<!DOCTYPE html>
<html>
<head>
  <title>Minimal Click Test</title>
  <style>
    body { font-family: Arial; padding: 20px; background: #222; color: #fff; }
    button { padding: 10px 20px; margin: 5px; font-size: 14px; cursor: pointer; background: #0088ff; color: white; border: none; }
    button:hover { background: #0066cc; }
  </style>
</head>
<body>

<h1>Minimal Click Test</h1>
<p>If you can click these buttons and see alerts, then clicking works.</p>

<button onclick="alert('Button 1 clicked!')">Button 1</button>
<button onclick="alert('Button 2 clicked!')">Button 2</button>
<button onclick="alert('Button 3 clicked!')">Button 3</button>

<p>If these work, the problem is with workspace.html's Alpine.js setup.</p>
<p>If these DON'T work, there's a browser/network issue.</p>

</body>
</html>
